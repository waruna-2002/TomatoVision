name: tomatovision_app
description: "TomatoVision AI - Real-time Quality & Shelf-Life Assessment App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # UI & Design System
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.3

  # Hardware & AI Engine
  camera: ^0.10.5+9
  tflite_flutter: ^0.10.4
  image: ^4.1.7

  # State Management & DI
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0

  # Reports & Utilities
  pdf: ^3.10.8
  printing: ^5.11.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets Path for TFLite Model, Labels & Assets
  assets:
    - assets/models/